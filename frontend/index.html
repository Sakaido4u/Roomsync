<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RoomSync</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Crect x='8' y='8' width='16' height='16' rx='3' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Lets keyboard users jump past the menu straight to the page content. -->
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Filled in by js/app.js once someone is logged in. -->
  <header id="site-header" class="site-header" hidden></header>

  <main id="main" class="page" tabindex="-1">
    <noscript>RoomSync needs JavaScript turned on.</noscript>
  </main>

  <!-- Short messages ("Booking cancelled") appear here; screen readers announce them. -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
